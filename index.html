<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alvora Clothing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card select {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
        .btn:hover { background: #218838; }
        .cart-section {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 8px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .btn-remove {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-remove:hover { background: #c82333; }
    </style>
</head>
<body>

    <header>
        <h1>Alvora Clothing</h1>
        <div>🛒 السلة: <span id="cart-count">0</span> منتجات</div>
    </header>

    <h2>المنتجات المتاحة</h2>
    <div class="products-grid">
        <!-- منتج 1 -->
        <div class="card">
            <h3>تيشرت كاجوال</h3>
            <p>السعر: 250 جنيه</p>
            <label for="size-1">اختر المقاس:</label>
            <select id="size-1">
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
            </select>
            <button class="btn" onclick="addToCart('تيشرت كاجوال', 250, 'size-1')">إضافة إلى السلة</button>
        </div>

        <!-- منتج 2 -->
        <div class="card">
            <h3>بنطلون جينز</h3>
            <p>السعر: 350 جنيه</p>
            <label for="size-2">اختر المقاس:</label>
            <select id="size-2">
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
            </select>
            <button class="btn" onclick="addToCart('بنطلون جينز', 350, 'size-2')">إضافة إلى السلة</button>
        </div>
    </div>

    <!-- قسم السلة -->
    <div class="cart-section">
        <h2>محتويات السلة</h2>
        <div id="cart-items">
            <p>السلة فارغة حالياً.</p>
        </div>
        <h3>الإجمالي: <span id="total-price">0</span> جنيه</h3>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price, sizeSelectId) {
            const size = document.getElementById(sizeSelectId).value;
            const item = { id: Date.now(), name, price, size };
            cart.push(item);
            updateCartUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cart-count');
            const cartItemsContainer = document.getElementById('cart-items');
            const totalPrice = document.getElementById('total-price');

            cartCount.textContent = cart.length;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p>السلة فارغة حالياً.</p>';
                totalPrice.textContent = 0;
                return;
            }

            let itemsHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price;
                itemsHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong> (المقاس: ${item.size}) - ${item.price} جنيه
                        </div>
                        <button class="btn-remove" onclick="removeFromCart(${item.id})">إلغاء/حذف</button>
                    </div>
                `;
            });

            cartItemsContainer.innerHTML = itemsHTML;
            totalPrice.textContent = total;
        }
    </script>
</body>
</html>
