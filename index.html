
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alvora Clothing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      text-align: center;
    }
    header {
      background-color: #333;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-icon {
      font-weight: bold;
      background-color: #e67e22;
      padding: 8px 15px;
      border-radius: 20px;
    }
    .products {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 20px;
      flex-wrap: wrap;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 200px;
    }
    .btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background-color: #219150;
    }
    footer {
      background-color: #222;
      color: #ccc;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Alvora Clothing</h1>
    <div class="cart-icon">السلة (0)</div>
  </header>

  <div class="products">
    <div class="card">
      <h3>تيشيرت</h3>
      <p>السعر: 250 جنيه</p>
      <button class="btn">إضافة إلى السلة</button>
    </div>
    <div class="card">
      <h3>بنطال</h3>
      <p>السعر: 400 جنيه</p>
      <button class="btn">إضافة إلى السلة</button>
    </div>
    <div class="card">
      <h3>شورت</h3>
      <p>السعر: 200 جنيه</p>
      <button class="btn">إضافة إلى السلة</button>
    </div>
    <div class="card">
      <h3>جاكيت</h3>
      <p>السعر: 650 جنيه</p>
      <button class="btn">إضافة إلى السلة</button>
    </div>
    <div class="card">
      <h3>سويت شيرت</h3>
      <p>السعر: 450 جنيه</p>
      <button class="btn">إضافة إلى السلة</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Alvora Clothing - جميع الحقوق محفوظة</p>
  </footer>

  <script>
    let cartCount = 0;
    const cartIcon = document.querySelector('.cart-icon');

    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', () => {
        cartCount++;
        alert('تمت إضافة المنتج إلى السلة!');
        if (cartIcon) {
          cartIcon.innerText = `السلة (${cartCount})`;
        }
      });
    });
  </script>

</body>
</html>
